<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aksara Bolaang Mongondow — Belajar Interaktif</title>
<style>
  :root {
    --bg: #171717;
    --card: #212121;
    --card-hover: #2b2b2b;
    --border: #2f2f2f;
    --text: #ececec;
    --text-dim: #9ca3af;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.15);
    --paper: #f5f0e6;
    --ink: #3a2f22;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; display:flex; align-items:center; gap:8px;}
  h1 .emoji { font-size: 24px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .info-toggle {
    display:inline-flex; align-items:center; gap:6px;
    background: var(--card); border:1px solid var(--border); color:#d1d5db;
    padding:6px 12px; border-radius:10px; font-size:12px; cursor:pointer; font-weight:600;
    margin-bottom: 16px;
  }
  .info-toggle:hover { background: var(--card-hover); }
  .info-box { display:none; border-color: rgba(251,191,36,0.35); font-size:13px; line-height:1.6; color:#d1d5db;}
  .info-box.show { display:block; }
  .info-box .credit { color: var(--text-dim); font-size:12px; margin-top:8px;}

  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .filter-btn {
    background: var(--card); border:1px solid var(--border); color:#d1d5db;
    padding:7px 14px; border-radius:10px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .filter-btn.active { background: var(--accent-dim); border-color: rgba(59,130,246,0.4); color:#fff; }
  .search-box {
    display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:6px 12px; margin-left:auto;
  }
  .search-box input {
    background:transparent; border:none; outline:none; color:#fff; font-size:12px; width:140px;
  }
  .quiz-btn {
    background: var(--accent); color:white; border:none; padding:8px 16px; border-radius:10px;
    font-size:12px; font-weight:700; cursor:pointer;
  }
  .quiz-btn:hover { background:#2563eb; }

  .grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr));
    gap:8px; margin-bottom: 24px;
  }
  .tile {
    background: var(--paper); border-radius:12px; border:2px solid transparent; padding:8px 4px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
  .tile.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .tile img { width:44px; height:64px; object-fit:contain; }
  .tile span { font-size:11px; font-weight:700; color: var(--ink); }

  .detail { display:flex; gap:16px; align-items:center; }
  .detail img { width:64px; height:96px; object-fit:contain; background:var(--paper); border-radius:12px; padding:8px; }
  .detail .rom { font-size:20px; font-weight:800; color:#fff; }
  .detail .meta { font-size:12px; color:var(--text-dim); margin-top:4px;}

  .quiz-card { border-color: rgba(59,130,246,0.35); }
  .quiz-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px;}
  .quiz-img-wrap { display:flex; justify-content:center; margin-bottom:16px; }
  .quiz-img-wrap img { width:80px; height:112px; object-fit:contain; background:var(--paper); border-radius:12px; padding:10px; }
  .choices { display:grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap:8px; }
  .choice-btn {
    background:#2b2b2b; border:1px solid var(--border); color:#fff; padding:10px; border-radius:10px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .choice-btn:hover { background:#333; }
  .choice-btn.correct { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.4); color: var(--green); }
  .choice-btn.wrong { opacity:0.35; }
  .feedback { margin-top:12px; font-size:13px; font-weight:700; }
  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }
  .close-quiz { margin-top:14px; background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; }

  h3.section-title { font-size:14px; font-weight:800; color:#fff; margin: 0 0 12px; }
  .example-card { margin-bottom: 12px; }
  .example-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .example-head .word { font-weight:700; color:#fff; }
  .badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid; }
  .badge.verified { color: var(--green); background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.3); }
  .badge.probable { color: var(--accent); background: var(--accent-dim); border-color: rgba(59,130,246,0.3); }
  .badge.uncertain { color: var(--amber); background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); }
  .breakdown { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .breakdown .syl { background:var(--paper); border-radius:8px; padding:5px; display:flex; flex-direction:column; align-items:center; }
  .breakdown .syl img { width:30px; height:42px; object-fit:contain; }
  .breakdown .syl span { font-size:9px; color:var(--ink); font-weight:600; }
  .meaning { font-size:12px; color:#d1d5db; margin-bottom:4px; }
  .source { font-size:11px; color:var(--text-dim); }

  footer.disclaimer {
    font-size:11px; color: var(--text-dim); border-top:1px solid var(--border); padding-top:14px; margin-top:8px;
    line-height:1.6;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="emoji">📜</span> Aksara Bolaang Mongondow</h1>
  <p class="subtitle">Belajar interaktif — klik simbol untuk melihat detail, atau coba mode kuis. Data &amp; gambar tersemat langsung di file ini (bisa dibuka offline).</p>

  <button class="info-toggle" onclick="toggleInfo()">ℹ️ Asal-usul &amp; status akademik</button>
  <div class="card info-box" id="infoBox">
    <p id="infoStatus"></p>
    <p class="credit" id="infoCredit"></p>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn" data-filter="vowel_a">Vokal A</button>
    <button class="filter-btn" data-filter="vowel_e_i">Vokal E / I</button>
    <button class="filter-btn" data-filter="vowel_o_u">Vokal O / U</button>
    <button class="filter-btn" data-filter="final_consonant">Konsonan Mati</button>
    <div class="search-box">
      🔎 <input id="searchInput" placeholder="Cari suku kata (mis. 'mo')" />
    </div>
    <button class="quiz-btn" onclick="startQuiz()">✨ Mulai Kuis</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="card detail" id="detailCard" style="display:none;">
    <img id="detailImg" src="" alt="" />
    <div>
      <div class="rom" id="detailRom"></div>
      <div class="meta" id="detailMeta"></div>
    </div>
  </div>

  <div class="card quiz-card" id="quizCard" style="display:none;">
    <div class="quiz-head">
      <span style="font-weight:700;color:#fff;">Aksara ini dibaca apa?</span>
      <span id="quizScore" style="color:var(--text-dim);"></span>
    </div>
    <div class="quiz-img-wrap"><img id="quizImg" src="" alt="" /></div>
    <div class="choices" id="quizChoices"></div>
    <div class="feedback" id="quizFeedback"></div>
    <button class="close-quiz" onclick="closeQuiz()">↩ Tutup kuis</button>
  </div>

  <h3 class="section-title">Contoh Kata &amp; Frasa</h3>
  <div id="examples"></div>

  <footer class="disclaimer" id="disclaimerText"></footer>
</div>

const DATA = {"script": {"name": "Aksara Bolaang Mongondow", "alt_names": ["Aksara Bicol Bolaang Mongondow", "Basahan (istilah asal Filipina untuk aksara Bicolano)"], "type": "abugida (setiap simbol dasar = konsonan + vokal inheren 'a'; diubah dengan diakritik untuk vokal lain, dan tanda silang '+' untuk mematikan vokal / bentuk akhir)", "direction": "kiri ke kanan", "letter_count": 15, "credit": "Bagan disusun ulang oleh @atmabumiangkasa (Instagram) berjudul 'Aksara Bolaang Mongondow' / 'Loloda Mokoagow'.", "related_research_community": "Historia Bolaang Mongondow Raya (HistoriaBMR) — mempublikasikan klaim penemuan aksara ini pada artefak 'Boyo-boyo' peninggalan Istana Komalig dan pada fragmen manuskrip berbahasa Spanyol.", "academic_status": "BELUM menjadi konsensus akademik arus utama. Klaim penggunaan historis aksara Bicol/Basahan di Bolaang Mongondow berasal dari riset komunitas/sejarah lokal, dan menurut sumber yang sama, klaim ini 'sangat ditentang oleh peneliti lainnya'. Gunakan sebagai materi budaya/edukasi dengan atribusi yang jelas, bukan sebagai fakta akademik final.", "structure_notes": ["Baris 1: konsonan + vokal inheren 'a' (15 simbol dasar).", "Baris 2: satu simbol yang sama dipakai untuk vokal 'e' dan 'i' (dibedakan lewat konteks/tanda kecil di atas simbol, mirip 'kudlit' pada aksara Baybayin/Basahan Filipina).", "Baris 3: satu simbol yang sama dipakai untuk vokal 'o' dan 'u'.", "Baris 4: bentuk 'mati' (konsonan akhir tanpa vokal), ditandai simbol silang '+' — mirip 'krus-kudlit/pamudpod' yang diperkenalkan misionaris Spanyol pada aksara Filipina untuk mematikan bunyi vokal. Huruf 'h' tidak memiliki bentuk mati pada bagan ini."], "sources": ["Bagan 'Aksara Bolaang Mongondow' / 'Loloda Mokoagow' oleh @atmabumiangkasa (koleksi pengguna).", "Papan tulis latihan transliterasi (koleksi pengguna).", "Fragmen naskah bertuliskan campuran Spanyol-aksara mengenai Sultan Baabullah (1557) dan pertemuan besar Loloda Mokoagow (1593) (koleksi pengguna).", "https:/ const FILTER_LABELS = { all: "Semua", vowel_a: "Vokal A", vowel_e_i: "Vokal E / I", vowel_o_u: "Vokal O / U", final_consonant: "Konsonan Mati" };
const CONF_LABEL = { verified: "Terverifikasi", probable: "Diperkirakan", uncertain: "Belum pasti" };

let currentFilter = "all";
let currentQuery = "";
let activeId = null;

function imgSrc(filename) { return IMAGES[filename] || ""; }

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const q = currentQuery.trim().toLowerCase();
  DATA.syllables
    .filter(s => (currentFilter === "all" || s.syllable_type === currentFilter))
    .filter(s => (q === "" || s.romanization.includes(q)))
    .forEach(s => {
      const tile = document.createElement("div");
      tile.className = "tile" + (s.id === activeId ? " active" : "");
      tile.innerHTML = `<img src="${imgSrc(s.glyph_image)}" alt="${s.romanization}"/><span>${s.romanization}</span>`;
      tile.onclick = () => showDetail(s);
      grid.appendChild(tile);
    });
  if (grid.children.length === 0) {
    grid.innerHTML = '<p style="color:var(--text-dim);grid-column:1/-1;text-align:center;padding:24px 0;">Tidak ada suku kata yang cocok.</p>';
  }
}

function showDetail(s) {
  activeId = s.id;
  renderGrid();
  document.getElementById("detailCard").style.display = "flex";
  document.getElementById("detailImg").src = imgSrc(s.glyph_image);
  document.getElementById("detailRom").textContent = s.romanization;
  document.getElementById("detailMeta").textContent =
    `Konsonan: ${s.consonant ?? "(tanpa konsonan)"} · Vokal: ${s.vowel ?? "(mati/tanpa vokal)"} · Tipe: ${FILTER_LABELS[s.syllable_type]}`;
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});
document.getElementById("searchInput").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  renderGrid();
});

function toggleInfo() {
  document.getElementById("infoBox").classList.toggle("show");
}

// ── Kuis ──────────────────────────────────────────────────────────────
let quizQuestion = null;
let quizScore = { correct: 0, total: 0 };
let quizLocked = false;

function startQuiz() {
  quizScore = { correct: 0, total: 0 };
  document.getElementById("quizCard").style.display = "block";
  newQuizQuestion();
}
function closeQuiz() {
  document.getElementById("quizCard").style.display = "none";
}
function newQuizQuestion() {
  quizLocked = false;
  const pool = DATA.syllables;
  quizQuestion = pool[Math.floor(Math.random() * pool.length)];
  const wrongPool = pool.filter(s => s.romanization !== quizQuestion.romanization);
  const wrongs = [];
  while (wrongs.length < 3 && wrongPool.length > 0) {
    const idx = Math.floor(Math.random() * wrongPool.length);
    const cand = wrongPool[idx].romanization;
    if (!wrongs.includes(cand)) wrongs.push(cand);
    wrongPool.splice(idx, 1);
  }
  const choices = [...wrongs, quizQuestion.romanization].sort(() => Math.random() - 0.5);
  document.getElementById("quizImg").src = imgSrc(quizQuestion.glyph_image);
  document.getElementById("quizFeedback").textContent = "";
  document.getElementById("quizFeedback").className = "feedback";
  document.getElementById("quizScore").textContent = `Skor: ${quizScore.correct}/${quizScore.total}`;
  const choicesEl = document.getElementById("quizChoices");
  choicesEl.innerHTML = "";
  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = choice;
    btn.onclick = () => answerQuiz(choice, btn);
    choicesEl.appendChild(btn);
  });
}
function answerQuiz(choice, btnEl) {
  if (quizLocked) return;
  quizLocked = true;
  const correct = choice === quizQuestion.romanization;
  quizScore.total += 1;
  if (correct) quizScore.correct += 1;
  document.getElementById("quizScore").textContent = `Skor: ${quizScore.correct}/${quizScore.total}`;
  document.querySelectorAll(".choice-btn").forEach(b => {
    if (b.textContent === quizQuestion.romanization) b.classList.add("correct");
    else b.classList.add("wrong");
  });
  const fb = document.getElementById("quizFeedback");
  fb.textContent = correct ? "Benar!" : `Kurang tepat, jawabannya "${quizQuestion.romanization}"`;
  fb.className = "feedback " + (correct ? "correct" : "wrong");
  setTimeout(newQuizQuestion, 900);
}

// ── Contoh kata ───────────────────────────────────────────────────────
function bySyllable(rom) {
  return DATA.syllables.find(s => s.romanization === rom);
}
function renderExamples() {
  const container = document.getElementById("examples");
  container.innerHTML = "";
  DATA.examples.forEach(ex => {
    const card = document.createElement("div");
    card.className = "card example-card";
    const breakdownHtml = ex.breakdown.map(rom => {
      const syl = bySyllable(rom);
      if (!syl) return "";
      return `<div class="syl"><img src="${imgSrc(syl.glyph_image)}" alt="${rom}"/><span>${rom}</span></div>`;
    }).join("");
    card.innerHTML = `
      <div class="example-head">
        <span class="word">${ex.mongondow_text}</span>
        <span class="badge ${ex.confidence}">${CONF_LABEL[ex.confidence]}</span>
      </div>
      <div class="breakdown">${breakdownHtml}</div>
      ${ex.meaning_id ? `<div class="meaning">${ex.meaning_id}</div>` : ""}
      <div class="source">${ex.source}</div>
    `;
    container.appendChild(card);
  });
}

// ── Init ──────────────────────────────────────────────────────────────
document.getElementById("infoStatus").textContent = DATA.script.academic_status;
document.getElementById("infoCredit").textContent = "Kredit: " + DATA.script.credit;
document.getElementById("disclaimerText").textContent = DATA.disclaimer;
renderGrid();
renderExamples();
</script>
